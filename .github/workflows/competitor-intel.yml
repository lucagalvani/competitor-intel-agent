name: Competitor intelligence

on:
  schedule:
    - cron: "0 7 * * 1"   # every Monday at 07:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
    inputs:
      competitor:
        description: "Only run for this competitor (optional)"
        required: false

permissions:
  contents: write  # commit snapshots and reports back to the repo
  issues: write    # open digest/alert issues

concurrency:
  group: competitor-intel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check config exists
        id: config
        run: |
          if [ -f config.yaml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No config.yaml yet — skipping. Create it with 'ci-agent init --company \"Your Company\"' or copy config.example.yaml, then commit it."
          fi

      - name: Install
        if: steps.config.outputs.found == 'true'
        run: pip install .

      - name: Run agent
        if: steps.config.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.competitor }}" ]; then
            ci-agent run --competitor "${{ github.event.inputs.competitor }}"
          else
            ci-agent run
          fi

      - name: Commit snapshots and reports
        if: always() && steps.config.outputs.found == 'true'
        run: |
          git config user.name "competitor-intel-agent"
          git config user.email "competitor-intel-agent@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Competitor intel: $(date -u +%Y-%m-%d)"
            git push
          fi
