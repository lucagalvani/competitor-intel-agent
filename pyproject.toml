[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitor-intel-agent"
version = "0.1.0"
description = "A company-agnostic competitive intelligence agent: tracks competitors' websites, pricing, changelogs, hiring and news, detects changes, and keeps battle cards up to date with Claude."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.14",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed for JavaScript-heavy sites (sources with `render: true`)
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
ci-agent = "ci_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ci_agent*"]

[tool.setuptools.package-data]
ci_agent = ["frameworks/*.md"]
